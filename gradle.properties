# Память для Gradle
#
# ⚠️ Поднято с 2G, и это НЕ «на всякий случай». С портом на 1.21.x версий
# стало ТРИНАДЦАТЬ, и `gradlew build` собирает их разом: каждая держит свою
# копию маппингов и ремапит свой jar. На 2 ГБ сборка падала с
# `OutOfMemoryError: Java heap space` — причём по одной версии всё собиралось,
# и беда выглядела как «сломался remapJar».
org.gradle.jvmargs=-Xmx4G

# ⚠️ Параллелизм ограничен НАРОЧНО. Loom при ремапе держит в памяти дерево
# классов игры, и четыре версии одновременно съедают больше, чем экономят
# по времени. Два потока — компромисс: сборка всех версий проходит и
# не упирается в память на машине с 8 ГБ.
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configuration-cache=false

# Fabric — версии сверять на https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.2

# Hypixel Mod API — официальные пакеты сервера (режим, локация).
# Версии: https://repo.hypixel.net/repository/Hypixel/net/hypixel/mod-api/
hypixel_modapi_version=1.0.2

# Свойства мода
mod_version=0.2.2
maven_group=ru.skyblockru
archives_base_name=skyblockru
